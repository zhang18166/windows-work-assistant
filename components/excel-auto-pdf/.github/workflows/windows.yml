name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish packages after successful checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt
      - name: Regression checks without Office
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: UI layout and log visibility
        run: python tests/test_ui.py
      - name: Build standalone EXE
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: excel-auto-pdf-windows
          path: dist/v1.3.5/*.exe

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: excel-auto-pdf-windows
          path: release-input
      - name: Package binary, source and checksums
        shell: pwsh
        run: python tools/package_ci_release.py --binary "release-input/Excel自动转PDFv1.3.5.exe" --version "1.3.5" --name "ExcelAutoPDF"
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.3.5"
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json id 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ExcelAutoPDF $tag" --notes-file CHANGELOG.md --draft
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $assets = @(Get-ChildItem -LiteralPath release-assets -File | ForEach-Object FullName)
          gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
